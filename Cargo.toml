[package]
name = "web-cli"
version = "0.3.0"
edition = "2021"
description = "Self-contained CLI for LLM-friendly web access: fetch, search, answer, crawl"
license = "MIT"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
urlencoding = "2.1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
